<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset your password &middot; CareerCrush</title>
<meta name="robots" content="noindex">
<!-- GitHub Pages cannot set response headers, so the policy is set here. The
     token must never leave this page in a Referer. -->
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wrap center">
  <div class="card">
    <h1>CareerCrush<span class="dot">.</span></h1>

    <div id="valid" hidden>
      <p class="lede">Opening the app to reset your password&hellip;</p>
      <p><a class="btn" id="open" href="#">Open CareerCrush</a></p>
      <p class="muted" style="font-size:0.9rem">If nothing happens, tap the button above.</p>
    </div>

    <div id="invalid" hidden>
      <p class="lede">This link is invalid or expired. Request a new one from the app.</p>
    </div>
  </div>
</main>
<script>
(function () {
  // Forwards a recovery link into the app. Exactly two values ever leave this
  // page: the token hash, checked against the shape Supabase issues, and the
  // literal type=recovery. The destination is fixed here and never read from
  // the URL, and every other parameter is dropped, so the page cannot be used
  // to push arbitrary query strings (or a session token) into the app.
  var APP_URL = 'careercrush://reset';
  var TOKEN_HASH = /^[A-Za-z0-9_-]{8,128}$/;

  // The email template puts the hash in the fragment (#token_hash=…), which
  // browsers never send to the server, so it stays out of hosting and CDN
  // logs. The query is still read for links emailed before that change; they
  // expire within an hour.
  var params = new URLSearchParams(window.location.hash.slice(1));
  if (!params.get('token_hash')) params = new URLSearchParams(window.location.search);
  var tokenHash = params.get('token_hash');
  var type = params.get('type');

  // Take the hash out of the address bar and history before anything else.
  if (window.history && window.history.replaceState) {
    window.history.replaceState(null, '', window.location.pathname);
  }

  if (type === 'recovery' && tokenHash && TOKEN_HASH.test(tokenHash)) {
    var target = APP_URL + '?token_hash=' + encodeURIComponent(tokenHash) + '&type=recovery';
    document.getElementById('open').href = target;
    document.getElementById('valid').hidden = false;
    window.location.replace(target);
  } else {
    document.getElementById('invalid').hidden = false;
  }
})();
</script>
</body>
</html>
